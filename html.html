<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор Квизов</title>
<style>
    :root {
        --bg-primary: #f5f7fa;
        --bg-secondary: #ffffff;
        --text-primary: #2d3436;
        --text-secondary: #636e72;
        --primary: #0984e3;
        --primary-hover: #74b9ff;
        --success: #00b894;
        --error: #d63031;
        --warning: #fdcb6e;
        --border: #dfe6e9;
        --shadow: 0 2px 10px rgba(0,0,0,0.08);
        --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .qb-wrapper {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.6;
        min-height: 100vh;
        width: 100%;
    }

    .app-header {
        background: linear-gradient(135deg, var(--primary), var(--primary-hover));
        color: white;
        padding: 1.5rem 2rem;
        box-shadow: var(--shadow-lg);
        text-align: center;
    }

    .app-title { font-size: 1.8rem; font-weight: 700; }

    .main-container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1.5rem;
    }

    .card {
        background: var(--bg-secondary);
        border-radius: 16px;
        padding: 2rem;
        margin-bottom: 1.5rem;
        box-shadow: var(--shadow);
    }

    .card-title {
        font-size: 1.3rem;
        color: var(--primary);
        margin-bottom: 1rem;
        font-weight: 600;
    }

    .form-group { margin-bottom: 1.5rem; }
    
    .form-label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: var(--text-primary);
    }

    .form-input, .form-textarea {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 2px solid var(--border);
        border-radius: 10px;
        font-size: 1rem;
        background: var(--bg-secondary);
        color: var(--text-primary);
        transition: all 0.3s;
    }

    .form-input:focus, .form-textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(9, 132, 227, 0.1);
    }

    .form-textarea { min-height: 100px; resize: vertical; }

    .btn {
        padding: 0.9rem 1.8rem;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        box-shadow: var(--shadow);
    }

    .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white; }
    .btn-success { background: linear-gradient(135deg, var(--success), #55efc4); color: white; }
    .btn-danger { background: linear-gradient(135deg, var(--error), #ff7675); color: white; }
    .btn-secondary { background: #e0e0e0; color: #333; }
    .btn-block { width: 100%; justify-content: center; }
    .btn-group { display: flex; gap: 1rem; flex-wrap: wrap; }

    .question-list { display: flex; flex-direction: column; gap: 1rem; }

    .question-item {
        background: var(--bg-primary);
        border-radius: 12px;
        padding: 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-left: 4px solid var(--primary);
    }

    .question-info { flex: 1; }
    .question-number { color: var(--primary); font-weight: 700; text-transform: uppercase; font-size: 0.85rem; margin-bottom: 0.3rem; }
    .question-preview { color: var(--text-secondary); font-size: 0.95rem; }
    .question-actions { display: flex; gap: 0.5rem; }
    .btn-icon { padding: 0.5rem 0.8rem; font-size: 0.9rem; }

    .modal-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.6);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 1rem;
    }

    .modal-overlay.active { display: flex; }

    .modal {
        background: var(--bg-secondary);
        border-radius: 20px;
        width: 100%;
        max-width: 900px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: var(--shadow-lg);
        animation: modalSlideIn 0.3s ease-out;
    }

    @keyframes modalSlideIn { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }

    .modal-header {
        padding: 1.5rem 2rem;
        border-bottom: 2px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .modal-title { font-size: 1.5rem; color: var(--primary); font-weight: 700; }

    .modal-close {
        background: none;
        border: none;
        font-size: 2rem;
        cursor: pointer;
        color: var(--text-secondary);
        line-height: 1;
    }

    .modal-close:hover { color: var(--error); }
    .modal-body { padding: 2rem; }
    .modal-footer { padding: 1.5rem 2rem; border-top: 2px solid var(--border); display: flex; justify-content: flex-end; gap: 1rem; }

    .options-list { display: flex; flex-direction: column; gap: 0.8rem; }
    .option-item { display: flex; align-items: center; gap: 1rem; padding: 0.5rem; }

    .option-number {
        width: 30px; height: 30px;
        background: var(--primary);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.9rem;
        flex-shrink: 0;
    }

    .custom-radio {
        width: 24px; height: 24px;
        border: 3px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: all 0.2s;
        background: var(--bg-secondary);
    }

    .custom-radio:hover { border-color: var(--primary); }
    .custom-radio.selected { background: var(--success); border-color: var(--success); }
    .custom-radio.selected::after { content: "✓"; color: white; font-weight: bold; font-size: 1.2rem; }

    .option-input-wrapper { flex: 1; display: flex; align-items: center; gap: 0.5rem; }
    .option-input {
        flex: 1;
        padding: 0.7rem 1rem;
        border: 2px solid var(--border);
        border-radius: 8px;
        font-size: 0.95rem;
        background: var(--bg-secondary);
        color: var(--text-primary);
    }
    .option-input:focus { outline: none; border-color: var(--primary); }

    .error-message {
        background: #ffebee;
        color: var(--error);
        padding: 1rem;
        border-radius: 8px;
        margin-top: 1rem;
        border-left: 4px solid var(--error);
        display: none;
    }
    .error-message.visible { display: block; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
    .stat-item { text-align: center; padding: 1rem; background: var(--bg-primary); border-radius: 12px; }
    .stat-value { font-size: 2rem; font-weight: 700; color: var(--primary); }
    .stat-label { font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.3rem; }

    .toast-container {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .toast {
        background: var(--bg-secondary);
        color: var(--text-primary);
        padding: 1rem 1.5rem;
        border-radius: 12px;
        box-shadow: var(--shadow-lg);
        display: flex;
        align-items: center;
        gap: 0.8rem;
        animation: toastSlideIn 0.3s ease-out;
        min-width: 300px;
    }

    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--error); }
    .toast.warning { border-left: 4px solid var(--warning); }
    .toast.info { border-left: 4px solid var(--primary); }

    @keyframes toastSlideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }

    .confirm-dialog { text-align: center; padding: 1rem; }
    .confirm-dialog p { font-size: 1.1rem; margin-bottom: 1.5rem; color: var(--text-primary); }
    .confirm-buttons { display: flex; justify-content: center; gap: 1rem; }
    .hidden-input { display: none; }

    @media (max-width: 768px) {
        .app-header { flex-direction: column; gap: 1rem; text-align: center; }
        .modal { max-width: 100%; margin: 1rem; }
        .modal-body { padding: 1.5rem; }
        .btn-group { flex-direction: column; }
        .btn { width: 100%; }
    }
</style>
</head>
<body>

<div class="qb-wrapper">
    <header class="app-header">
        <h1 class="app-title">🎯 Конструктор Квизов</h1>
    </header>
    
    <main class="main-container">
        <div class="card">
            <h2 class="card-title">📝 Информация о квизе</h2>
            <div class="form-group">
                <label class="form-label" for="quizTitleInput">Название квиза</label>
                <input type="text" id="quizTitleInput" class="form-input" placeholder="Введите название квиза..." value="Мой квиз">
            </div>
            
            <div class="btn-group">
                <button class="btn btn-primary" id="newQuizBtn"><span>📄</span> Новый</button>
                <button class="btn btn-primary" id="openQuizBtn"><span>📂</span> Открыть</button>
                <button class="btn btn-success" id="saveQuizBtn"><span>💾</span> Сохранить</button>
                <button class="btn btn-primary" id="generateHtmlBtn"><span>🌐</span> Генерация HTML</button>
            </div>
            <input type="file" id="fileInput" class="hidden-input" accept=".json">
            
            <div id="generatedHtmlModal" class="modal-overlay">
                <div class="modal" style="max-width: 900px;">
                    <div class="modal-header">
                        <h3 class="modal-title">Код готов к вставке</h3>
                        <button class="modal-close" id="closeGeneratedHtmlBtn">&times;</button>
                    </div>
                    <div class="modal-body">
                        <textarea id="htmlOutput" class="form-textarea" style="min-height: 400px; font-family: monospace; font-size: 0.85rem; width: 100%;"></textarea>
                        <div class="btn-group" style="margin-top: 1rem;">
                            <button id="copyHtmlBtn" class="btn btn-primary">📋 Копировать</button>
                            <button id="downloadHtmlBtn" class="btn btn-success">💾 Скачать HTML</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">📊 Статистика</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalQuestions">0</div>
                    <div class="stat-label">Вопросов</div>
                </div>
            </div>
        </div>

        <div id="aiPanelRoot"></div>

        <div class="card">
            <h2 class="card-title">❓ Вопросы</h2>
            <div id="questionsList" class="question-list">
                <p style="color: var(--text-secondary); text-align: center; padding: 2rem;">Вопросы пока не добавлены. Нажмите "Добавить вопрос" ниже.</p>
            </div>
            <div style="margin-top: 1.5rem; text-align: center;">
                <button class="btn btn-success btn-block" id="addQuestionBtn"><span>➕</span> Добавить вопрос</button>
            </div>
        </div>
    </main>
    
    <div id="questionModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitleEl">Добавить вопрос</h3>
                <button class="modal-close" id="closeQuestionModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="questionText">Текст вопроса *</label>
                    <textarea id="questionText" class="form-textarea" placeholder="Введите текст вопроса..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Подсказка / пояснение (необязательно)</label>
                    <textarea id="explanationInput" class="form-textarea" placeholder="Подсказка, которая появится сразу после ответа на вопрос..." style="min-height: 60px;"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Варианты ответов (отметьте правильный) *</label>
                    <div id="optionsContainer" class="options-list"></div>
                    <div style="display:flex;gap:10px;margin-top:15px;">
                        <button type="button" id="addOptionBtn" class="btn btn-secondary" style="flex:1;">+ Добавить вариант</button>
                        <button type="button" id="removeOptionBtn" class="btn btn-secondary" style="flex:1;">− Удалить вариант</button>
                    </div>
                </div>
                <div id="questionError" class="error-message"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelQuestionBtn">Отмена</button>
                <button class="btn btn-success" id="saveQuestionBtn">Сохранить вопрос</button>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="modal-overlay">
        <div class="modal" style="max-width: 500px;">
            <div class="modal-header">
                <h3 class="modal-title" id="confirmTitle">Подтверждение</h3>
                <button class="modal-close" id="closeConfirmModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="confirm-dialog">
                    <p id="confirmMessage">Вы уверены?</p>
                    <div class="confirm-buttons">
                        <button class="btn btn-secondary" id="cancelConfirmBtn">Отмена</button>
                        <button class="btn btn-danger" id="confirmBtn">Продолжить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
</div>


<script src="js.js"></script>
<script src="ai.js"></script>
</body>
</html>
